<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva de Citas — Cliente Optimizado</title>
<!-- ==========================================================================
CLIENTE (el "consumidor" del estilo Cliente-Servidor)
-----------------------------------------------------------------------------
Este archivo ES la aplicación cliente. Fíjense en lo que NO tiene:
  - No tiene reglas de negocio complejas (aunque ahora bloquea fechas pasadas en UI).
  - No tiene acceso a la base de datos (no conoce a Supabase).
Solo hace dos cosas: MOSTRAR datos y ENVIAR peticiones al servidor por HTTP.
=========================================================================== -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Reserva de Citas</h1>
  <p>Aplicación CLIENTE — todo el trabajo lo hace el servidor</p>
</header>

<main>
  <section>
    <h2>Nueva cita</h2>
    <label for="paciente">Nombre del paciente</label>
    <input id="paciente" type="text" placeholder="Ej: Ana Gómez">

    <label for="profesional">Profesional</label>
    <select id="profesional"></select>

    <label for="fecha">Fecha y hora</label>
    <input id="fecha" type="datetime-local">

    <button id="btn-reservar" onclick="crearCita()">Reservar</button>
    <div id="mensaje"></div>
  </section>

  <section>
    <h2>Citas registradas (las mismas para TODOS los clientes)</h2>
    <button class="secundario" onclick="cargarCitas(0)">Actualizar lista</button>
    
    <div style="overflow-x: auto; margin-top: 10px;">
      <table>
        <thead><tr><th>Paciente</th><th>Profesional</th><th>Fecha y hora</th></tr></thead>
        <tbody id="tabla-citas"></tbody>
      </table>
    </div>
    
    <div class="paginacion">
      <button id="btn-prev" class="secundario" onclick="cambiarPagina(-1)" disabled>« Anteriores</button>
      <button id="btn-next" class="secundario" onclick="cambiarPagina(1)">Siguientes »</button>
    </div>
  </section>

  <p id="estado-servidor">Consultando servidor…</p>
</main>

<script src="app.js"></script>
</body>
</html>
